name: bt-upstream-watch

# Weekly read-only compare against upstream; keeps one rolling issue titled bt-sync in this fork.
# Third-party actions: only actions/* at a major tag (actions/github-script@v7, actions/checkout@v4).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const w = require('./.github/scripts/bt-upstream-watch.js');
            await w.run({ github, context, core }, 'rokucommunity/rooibos');
