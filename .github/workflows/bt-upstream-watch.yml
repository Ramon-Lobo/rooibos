name: bt-upstream-watch

# Weekly read-only compare against upstream; keeps one rolling issue titled bt-sync in this fork.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bt-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          UPSTREAM_REPO: rokucommunity/rooibos
        with:
          script: |
            const w = require('./.github/scripts/bt-upstream-watch.js');
            await w.run({ github, context, core }, process.env.UPSTREAM_REPO);
